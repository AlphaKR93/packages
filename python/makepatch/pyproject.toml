[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project.entry-points.hatch]
makepatch = "makepatch.__hooks__"

[project.scripts]
apply-patches = "makepatch.scripts:apply_patches"
rebuild-patches = "makepatch.scripts:rebuild_patches"


[project]
name = "makepatch"
version = "0.2.5"
authors = [{ name = "Alpha", email = "dev@alpha93.kr" }]
description = "Hatch build hook to easily hard-fork packages with patches!"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Environment :: Plugins",
    "Framework :: Hatch",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",

    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "hatchling>=1.29.0",
    "pydantic>=2.13.0",
    "typing_extensions>=4.15.0; python_version < '3.15'",
]

[dependency-groups]
dev = []

[project.urls]
# homepage = "https://alpha93.kr/project/python/makepatch"
source = "https://github.com/AlphaKR93/packages/tree/main/python/makepatch"
issues = "https://github.com/AlphaKR93/packages/issues"

