[project]
name = "makepatch"
version = "0.1.8"
authors = [{ name = "Alpha", email = "dev@alpha93.kr" }]
description = "Hatch build hook to easily hard-fork packages with patches!"
requires-python = ">=3.12"
classifiers = [
    "Framework :: Hatch",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "hatchling>=1.29.0",
    "pydantic>=2.13.0",
    "typing_extensions>=4.15.0; python_version < '3.15'",
]

[dependency-groups]
dev = []

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project.entry-points.hatch]
makepatch = "makepatch.__hook__"

[project.scripts]
init-patches = "makepatch.scripts:init_patches"
rebuild-patches = "makepatch.scripts:rebuild_patches"
