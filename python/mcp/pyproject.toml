[build-system]
requires = ["hatchling", "makepatch>=0.2.5"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha93"]


[project]
name = "mcp-minimal"
version = "1.27.1"
authors = [{ name = "Alpha", email = "dev@alpha93.kr" }]
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.5",
    "httpx>=0.27.1,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.14.2",
    "jsonschema>=4.20.0",
    "typing-inspection>=0.4.1",
    "starlette-minimal>=0.27",
    "cryptography>=48.0.1",
]

[dependency-groups]
dev = [
    "makepatch>=0.2.5",
]

[tool.uv]
exclude-dependencies = ["python-dotenv", "starlette"]

[tool.uv.sources]
alpha93 = { path = "../alpha93" }
makepatch = { path = "../makepatch" }
starlette-minimal = { path = "../starlette" }


[tool.hatch.build.hooks.makepatch]
[tool.hatch.build.hooks.makepatch.options]
module-source = "src/mcp"
excludes = [
    "cli/**/*",
    "client/**/*",
    "os/**/*",
    "server/__main__.py",
    "server/sse.py",
    "server/websocket.py",
]
dev-excludes = [
    ".github/**/*",
    "docs/**/*",
    "examples/**/*",
    "scripts/**/*",
    "tests/**/*",
    ".git-blame-ignore-revs",
    ".gitattribute",
    ".pre-commit-config.yaml",
    "CLAUDE.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "DEPENDENCY_POLICY.md",
    "mkdocs.yml",
    "RELEASE.md",
    "ROADMAP.md",
    "SECURITY.md",
    "VERSIONING.md"
]
