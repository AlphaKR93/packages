[project]
name = "alpha93"
dynamic = ["version"]
authors = [{ name = "Alpha", email = "dev@alpha93.kr" }]
description = "Various common utility modules by @AlphaKR93"
license = "MIT"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Other Environment",
    "Intended Audience :: Developers",

    "Topic :: Utilities",
    "Typing :: Typed",

    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
]
dependencies = [
    "terser-hints>=0.1.1",
]

[project.urls]
# homepage = "https://alpha93.kr/project/python/commons"
source = "https://github.com/AlphaKR93/packages/tree/main/python/alpha93"
issues = "https://github.com/AlphaKR93/packages/issues"
changelog = "https://github.com/AlphaKR93/packages/blob/main/python/alpha93/CHANGELOG.md"

[tool.uv.sources]
alpha93-stubs = { workspace = true }

[tool.ty.environment]
python = "../../.venv"
extra-paths = ["../stubs/src"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "alpha93-stubs",
]

[tool.hatch.version]
path = "../../alpha93/__init__.pyi"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha93"]
