[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha93"]


[project]
name = "alpha93-stubs"
version = "1.0.1"
authors = [{ name = "Alpha", email = "dev@alpha93.kr" }]
description = "Some type stubs by @AlphaKR93"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Other Environment",
    "Intended Audience :: Developers",

    "Topic :: Utilities",
    "Typing :: Stubs Only",

    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
]

[project.urls]
# homepage = "https://alpha93.kr/project/python/commons"
source = "https://github.com/AlphaKR93/packages/tree/main/python/alpha93"
issues = "https://github.com/AlphaKR93/packages/issues"
