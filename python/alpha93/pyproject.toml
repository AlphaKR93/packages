[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "alpha93/__init__.pyi"

[tool.hatch.build.targets.wheel]
packages = ["alpha93"]


[project]
name = "commons"
dynamic = ["version"]
description = "commons library by @AlphaKR93"
authors = [{ name = "Alpha", email = "dev@alpha93.kr" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.1",
    "ty>=0.0.66",
]

[project.urls]
homepage = "https://github.com/AlphaKR93/packages"  # TODO: https://alpha93.kr/projects/commons-python
source = "https://github.com/AlphaKR93/packages/blob/HEAD/python/alpha93"

[tool.uv.workspace]
members = ["packages/*"]
