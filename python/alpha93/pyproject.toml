[project]
name = "alpha93"
version = "0.3.11"
description = "commons library for alpha93"
authors = [{ name = "Alpha", email = "dev@alpha93.kr" }]
requires-python = ">=3.12"
dependencies = []

[project.urls]
homepage = "https://github.com/AlphaKR93/packages"  # TODO: https://alpha93.kr/projects/commons-python
source = "https://github.com/AlphaKR93/packages/blob/HEAD/python/alpha93"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha93", "types/alpha93"]

[tool.hatch.build.targets.wheel.force-include]
"src/terser_hints.py" = "terser_hints.py"
"src/terser_hints.pyi" = "terser_hints.pyi"
