[project]
name = "starlette-minimal"
dynamic = ["version"]
authors = [{ name = "Alpha", email = "dev@alpha93.kr" }]
requires-python = "==3.14.*"
dependencies = [
    "alpha93",
    "anyio>=4.13.0",
]

[dependency-groups]
dev = ["makepatch"]

[tool.uv.sources]
alpha93 = { path = "../alpha93" }
makepatch = { path = "../makepatch" }

[build-system]
requires = ["hatchling", "makepatch"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "work/sources/starlette/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha93"]

[tool.hatch.build.targets.wheel.force-include]
"src/starlette" = "starlette"

[tool.hatch.build.hooks.makepatch]
dependencies = ["makepatch"]

[tool.hatch.build.hooks.makepatch.options]
module-source = "starlette"
excludes = [
    "middleware/sessions.py",
    "middleware/wsgi.py",
    "config.py",
    "formparsers.py",
    "routing.py",
    "schemas.py",
    "staticfiles.py",
    "status.py",
    "templating.py",
    "testclient.py",
    "types.py",
    "websockets.py",
]
dev-excludes = [
    ".github/**/*",
    "docs/**/*",
    "scripts/**/*",
    "tests/**/*",
    "mkdocs.yml",
    "CITATION.cff",
]

[tool.ruff]
src = ["src", "work/patched"]
